name = "squared-agent-dashboard-api"
main = "src/index.ts"
compatibility_date = "2024-01-01"

[[d1_databases]]
binding = "DB"
database_name = "squared-agent-sessions"
# Replace with your D1 database ID after running: wrangler d1 create squared-agent-sessions
database_id = "YOUR_D1_DATABASE_ID"

[vars]
# Set to your dashboard URL (or "*" for development)
CORS_ORIGIN = "*"

# Optional: Add custom route if you have a domain
# [[routes]]
# pattern = "api.yourdomain.com/*"
# zone_name = "yourdomain.com"
